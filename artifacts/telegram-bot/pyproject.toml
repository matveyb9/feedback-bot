[project]
name = "feedback-tgbot"
version = "0.1.0"
description = "Open-source Telegram feedback bot"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiogram>=3.20.0,<4.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.16.0,<2.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "structlog>=25.1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "sqlalchemy[mypy]>=2.0.35",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true

[tool.uv]
package = false
